model:
    embedding_dim: 200
    hidden_dim: 128
    num_layers: 1
    dropout: 0
    output_dim: 1

training:
    batch_size: 128
    lr: 0.001
    epochs: 20
    weight_decay: 0.00001
    max_vocab_size: 50000

seed:
    seed: 777

data:
    train_frac: 0.7
    test_frac: 0.5
    feature_col: "clean_text"
    label_col : "target_reaction"
    path: ["data/tweet_pos_1.csv", "data/tweet_neg_2.csv"]
